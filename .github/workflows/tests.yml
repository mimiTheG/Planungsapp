# Automatische Tests: laufen bei jedem Pull Request und bei jedem Push auf main.
# Im Pull Request erscheint dann ein grüner Haken (alles ok) oder ein rotes Kreuz (ein Test schlägt fehl).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Tests (npm test)
        run: npm test
